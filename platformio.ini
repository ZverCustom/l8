[platformio]
default_envs = l8_v3

[env:l8_v3]
platform = espressif32@6.8.0
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_qspi
board_build.flash_mode = qio
upload_speed = 460800
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
extra_scripts =
    pre:scripts/patch_wifi_scan.py
    pre:scripts/patch_stream_yield.py
    pre:scripts/patch_fastled.py
    pre:scripts/embed_ui.py
    pre:scripts/build_version.py
build_unflags = -DARDUINO_RUNNING_CORE=1 -DARDUINO_EVENT_RUNNING_CORE=1
build_flags =
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_RUNNING_CORE=0
    -D ARDUINO_EVENT_RUNNING_CORE=0
    -D FASTLED_ESP32_FLASH_LOCK=1
    -D FASTLED_RMT_MAX_TICKS_FOR_GTX_SEM=500
    -D L8_HW_REV=3
lib_deps =
    fastled/FastLED@3.7.8
    bblanchon/ArduinoJson@6.21.5

[env:native]
test_ignore =
    test_settings
    test_protocol
    test_panel_rx
    test_panel_core
platform = native
build_flags = -std=gnu++17
lib_compat_mode = off
test_framework = unity

# Oscilloscope/bench only. Firmware and PCB pin map are otherwise identical.
[env:l8_v3_dma]
extends = env:l8_v3
extra_scripts =
    pre:scripts/patch_wifi_scan.py
    pre:scripts/patch_stream_yield.py
    pre:scripts/embed_ui.py
    pre:scripts/build_version.py
build_flags =
    ${env:l8_v3.build_flags}
    -D L8_LED_LCD_DMA=1

[env:l8_v3_dma_flash]
extends = env:l8_v3_dma
build_flags =
    ${env:l8_v3_dma.build_flags}
    -D L8_DMA_FLASH_CONCURRENT=1

[env:native_settings]
extends = env:native
build_flags = -std=gnu++17 -Itest/support -Isrc -Ilib/v3_safety -Ilib/strict_json -Ilib/line_framer
lib_deps = bblanchon/ArduinoJson@6.21.5
test_filter =
    test_settings
    test_protocol
test_ignore =

# ZMB core with AddressSanitizer + UBSan (native only).
[env:native_zmb_san]
extends = env:native
build_flags = -std=gnu++17 -fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all
extra_scripts = post:scripts/sanitize_link.py
test_filter = test_zmb
test_ignore =

# Panel receive library (task 026): warnings as errors, AddressSanitizer + UBSan (native only).
[env:native_panel_rx_san]
extends = env:native
build_flags = -std=gnu++17 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all
extra_scripts = post:scripts/sanitize_link.py
test_filter = test_panel_rx
test_ignore =

# Panel mode core (task 027): warnings as errors, AddressSanitizer + UBSan (native only).
[env:native_panel_core_san]
extends = env:native
build_flags = -std=gnu++17 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all
extra_scripts = post:scripts/sanitize_link.py
test_filter = test_panel_core
test_ignore =
