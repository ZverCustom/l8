gap:22px;flex-wrap:wrap;color:var(--muted);margin-bottom:24px}.statusbar b{color:var(--text);font-weight:500}.panel{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:22px;margin:0 0 20px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.metrics{margin-bottom:22px}.metric{border-left:2px solid #434b56;padding:8px 20px}.metric span{display:block;color:var(--muted);font-size:11px;margin-bottom:7px}.metric strong{font-size:32px;font-weight:500;font-variant-numeric:tabular-nums}.metric small{color:var(--muted);margin-left:6px}.channel{padding:18px;background:var(--panel);border:1px solid var(--line);border-radius:9px;cursor:pointer;text-align:left;min-height:130px}.channel:hover{border-color:#6d7685}.channel.on{border-color:#427a61}.channel.fault{border-color:var(--red)}.channel .number{font-size:11px;letter-spacing:1px;color:var(--muted)}.channel .current{font-size:26px;margin:12px 0}.channel .state{font-size:11px;color:var(--muted)}.bar{height:3px;background:#343943;margin-top:13px;overflow:hidden;border-radius:2px}.bar i{display:block;background:var(--green);height:100%;width:0}.formgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px}.field{display:flex;flex-direction:column;gap:8px;color:var(--muted);font-size:12px}input,select{width:100%;background:#111419;color:var(--text);border:1px solid #3a414c;padding:10px 11px;border-radius:6px;min-height:40px}input[type=checkbox]{width:20px;min-height:20px;accent-color:var(--red)}input[type=color]{padding:5px;height:42px}input:focus,select:focus{outline:1px solid var(--red);border-color:var(--red)}.hint{color:var(--muted);font-size:12px;line-height:1.7;margin:14px 0}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.chip{padding:4px 9px;background:#303640;border-radius:5px;font-size:11px}.ok{color:var(--green)}.warning{color:#ffac69}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin:23px 0 14px}.sectionhead h2{margin:0}.stripnav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.stripnav button.active{background:var(--red);color:#160c09;border-color:var(--red)}pre{background:#101216;padding:16px;border-radius:6px;overflow:auto;max-height:400px;font:12px/1.7 ui-monospace,monospace;white-space:pre-wrap}.notice{border-left:3px solid var(--red);padding:11px 15px;color:var(--muted);line-height:1.7;background:#241e1d;margin-bottom:20px}.toast{position:fixed;right:28px;bottom:24px;max-width:420px;background:#283a32;color:#eafff4;border:1px solid #56846a;border-radius:8px;padding:14px 20px;z-index:10;display:none}.toast.error{background:#44231f;border-color:#c2594a}.colorpreview{height:22px;border-radius:4px;margin-bottom:20px;background:repeating-linear-gradient(90deg,#ff2400 0 12px,#202020 12px 16px)}.badge{color:var(--muted);font-size:11px}.muted{color:var(--muted)}footer{color:#78818e;font-size:11px;border-top:1px solid var(--line);padding-top:17px;margin-top:28px;display:flex;justify-content:space-between}#dirty{font-size:11px;color:#ffaf85}#view{min-height:480px}@media(max-width:1000px){main{padding:24px}.grid{grid-template-columns:repeat(2,1fr)}.formgrid{grid-template-columns:repeat(2,1fr)}}@media(max-width:680px){.shell{display:block}aside{height:auto;position:static;padding:18px;border-right:0;border-bottom:1px solid var(--line)}.brand{font-size:20px}.subbrand,.sidefoot{display:none}nav{display:flex;overflow:auto;margin-top:15px}nav button{white-space:nowrap;width:auto}.formgrid{grid-template-columns:1fr}main{padding:20px 14px}header{align-items:flex-start;flex-direction:column}h1{font-size:26px}.metric{padding:8px 10px}.metric strong{font-size:27px}.statusbar{gap:12px;font-size:12px}.panel{padding:17px}.toast{left:14px;right:14px;bottom:14px}}
</style></head><body><div class="shell"><aside><div class="brand">ZVER<b>L8</b></div><div class="subbrand">LIGHT CONTROLLER</div><nav id="nav"></nav><div class="sidefoot"><span id="dot" class="dot"></span><span id="connection">Подключение…</span><br>8 каналов · 12 В<br>Аппаратная ревизия 3</div></aside><main><header><div><div class="eyebrow">Настройка контроллера</div><h1 id="title">Обзор</h1></div><div class="actions"><span id="dirty"></span><button id="discardPreview">Отменить</button><button id="save" class="primary" disabled>Сохранить</button><button id="master" disabled>Master · выкл.</button></div></header><div class="statusbar"><span>Питание <b id="vbat">—</b></span><span>IGN <b id="ign">—</b></span><span>Ток лент <b id="total">—</b></span><span id="powerStatus">Ожидание данных</span></div><div id="view"><div class="panel">Соединение с ZVER L8…</div></div><footer><span>ZVER L8 <span id="version"></span></span><span id="ip">Локальное подключение</span></footer></main></div><div id="toast" class="toast" role="status"></div>
<script>
'use strict';
const pages=['Обзор','Каналы','Входы','CAN / ЭБУ','IMU','Wi-Fi','Система'];
const animations=['Постоянный цвет','Бегущая тройка','Цветовая волна','Дыхание','Радуга','Змейка','Метеор','Мерцание','Бегущие огни','Сканер','Огонь','Полиция','Конфетти','Заливка','Маятник','Перегрузка'];
const sources=['Обороты','Скорость','Дроссель','Боковое ускорение','Угловая скорость','Вход 1','Вход 2','Вход 3'];
let config=null,state=null,page=0,strip=0,token='',dirty=false,busy=false,editRevision=0;
const $=id=>document.getElementById(id), esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=(v,n=2)=>Number.isFinite(+v)?(+v).toFixed(n):'—';
function toast(text,error=false){$('toast').textContent=text;$('toast').className='toast'+(error?' error':'');$('toast').style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').style.display='none',6500)}
// Serialize requests: the embedded HTTP server handles one client at a time.
let apiQueue=Promise.resolve();
async function request(path,options={}){
 const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),path==='ota'?120000:8000);
 try{const r=await fetch('/api/'+path,{cache:'no-store',...options,signal:controller.signal,headers:{'X-L8-Token':token,...options.headers}});
 const text=await r.text();let data;try{data=JSON.parse(text)}catch{if(r.ok&&!['log','can'].includes(path))throw Error('Неполный ответ контроллера');data=text}
 if(!r.ok){const e=Error(data.error||text||r.status);e.status=r.status;throw e}return data;
 }catch(e){if(e.name==='AbortError')throw Error('Контроллер не ответил за отведённое время');throw e}finally{clearTimeout(timer)}
}
function api(path,options={}){
 const run=async()=>{try{return await request(path,options)}catch(e){
 // Only an explicit rejection is safe to retry; never repeat a timed-out write.
 if(e.status!==403||path==='session')throw e;token=(await request('session')).token;return request(path,options)}};
 const result=apiQueue.then(run);apiQueue=result.catch(()=>{});return result;
}
const post=(path,data)=>api(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
// A short patch changes only RAM. The editor owns a revisioned 60 s lease;
// save commits that revision, and hidden/closed editors stop renewing it.
const editorId=Math.random().toString(36).slice(2)+Date.now().toString(36);
let serverRevision=0, previewOpen=false, previewFull=false, previewPatches=new Map(), previewError=null, needFull=false;
let previewInFlight=null, previewGate=false, previewTimer=null, deviceBoot=null;
const PREVIEW_INTERVAL=100, sentValues=new Map();
const clone=x=>JSON.parse(JSON.stringify(x));
function pendingPreview(){return previewFull||previewPatches.size>0}
// Live preview: at most one change request in flight and one send per interval.
// While a request runs only the latest value per channel/field waits; nothing queues.
function schedulePreview(path,value){
 const match=/^strips\.(\d)\.(color|brightness|speed)$/.exec(path);
 if(match){
  const i=+match[1],waiting=previewPatches.get(i);
  // change/pointerup repeating a value already sent adds no request
  if(!previewFull&&!needFull&&sentValues.get(path)===value&&!(waiting&&match[2] in waiting))return;
  previewPatches.set(i,{...waiting,[match[2]]:value});
 }else previewFull=true;
 if(needFull){previewFull=true;needFull=false}
 pumpPreview();
}
function pumpPreview(){
 if(busy||previewError||previewInFlight||previewGate||document.hidden||!pendingPreview()){showDirty();return}
 previewGate=true;previewTimer=setTimeout(()=>{previewGate=false;previewTimer=null;pumpPreview()},PREVIEW_INTERVAL);
 const full=previewFull,patches=new Map(previewPatches);previewFull=false;previewPatches.clear();
 sendJobs(full?[['apply',{config:clone(config)}]]:[...patches].map(([strip,patch])=>['preview',{strip,patch}])).catch(e=>toast(e.message,true));
}
// Sends preview/apply jobs in order on the current revision. An explicit 400 waits for
// the next edit (as a full apply); anything else stops the chain until reconciled.
function sendJobs(jobs){
 const run=(async()=>{
  try{
   for(const [path,body] of jobs){
    const r=await post(path,{client:editorId,revision:serverRevision,...body});
    serverRevision=r.revision;previewOpen=true;if(state){state.configRevision=r.revision;if('savedRevision' in r)state.savedRevision=r.savedRevision}
    if(path==='preview')for(const [k,v] of Object.entries(body.patch))sentValues.set(`strips.${body.strip}.${k}`,v);else sentValues.clear();
   }
  }catch(e){if(e.status===400)needFull=true;else previewError=e;throw e}
  finally{if(previewInFlight===run)previewInFlight=null;showDirty();if(!busy)pumpPreview()}
 })();
 previewInFlight=run;showDirty();return run;
}
async function settlePreview(){while(previewInFlight)await previewInFlight.catch(()=>{})}
// Kept for callers that need every pending edit applied (no snapshot semantics).
async function flushPreview(){await settlePreview();if(previewError)throw previewError;if(pendingPreview()){const full=previewFull,patches=new Map(previewPatches);previewFull=false;previewPatches.clear();await sendJobs(full?[['apply',{config:clone(config)}]]:[...patches].map(([strip,patch])=>['preview',{strip,patch}]))}}
// After a lost reply, conflict or reboot the device state is read, never assumed.
// A foreign preview is not overridden; our own edits are re-applied only by an
// explicit Save as a full apply on the revision just read.
async function reconcile(){
 const st=await api('status');noteBoot(st);state=st;updateLive();
 if(st.previewActive&&st.previewOwner&&st.previewOwner!==editorId){const e=Error('Настройки сейчас изменяет другой редактор');e.status=409;throw e}
 serverRevision=st.configRevision;previewOpen=!!st.previewActive&&(!st.previewOwner||st.previewOwner===editorId);previewError=null;sentValues.clear();
}
function noteBoot(st){
 if(!st||!st.bootId)return;
 if(deviceBoot&&st.bootId!==deviceBoot){previewOpen=false;sentValues.clear();if(dirty||pendingPreview()||previewInFlight){previewError=Error('Контроллер перезагрузился — изменения не применены');toast(previewError.message,true)}}
 deviceBoot=st.bootId;
}
function showDirty(){
 let text='';
 if(previewError)text='Не применено — нажмите «Сохранить» для сверки';
 else if(previewInFlight)text='Отправляется…';
 else if(dirty)text=pendingPreview()||needFull||!previewOpen?'Есть изменения':'Применено, не сохранено';
 else if(state&&state.savedRevision!=null&&state.savedRevision===state.configRevision&&!state.previewActive)text='Записано';
 put('dirty',text);if($('save'))$('save').disabled=busy||!dirty;
}
async function keepPreview(){
 try{if(previewOpen&&!busy&&!document.hidden&&!previewError){await settlePreview();if(!busy&&previewOpen&&!previewError)await post('touch',{client:editorId,revision:serverRevision})}}catch(e){previewError=e;showDirty();toast('Предпросмотр завершён: '+e.message,true)}
 setTimeout(keepPreview,10000);
}
// Back from a hidden tab: check lease and boot before any pending edit is sent.
async function resumeVisible(){
 if(!(previewOpen||pendingPreview()))return;
 try{const st=await api('status');noteBoot(st);state=st;updateLive();
  if(previewOpen&&!(st.previewActive&&(!st.previewOwner||st.previewOwner===editorId))){previewOpen=false;previewError=Error('Предпросмотр завершился, пока вкладка была скрыта')}
 }catch(e){previewError=e}
 showDirty();pumpPreview();
}
async function discardPreview(){
 if(busy)return;busy=true;clearTimeout(previewTimer);previewGate=false;
 try{
 previewFull=false;previewPatches.clear();await settlePreview();
 serverRevision=(await api('status')).configRevision;
 const r=await post('discard',{client:editorId,revision:serverRevision});serverRevision=r.revision;
 if(state){state.configRevision=serverRevision;if('savedRevision' in r)state.savedRevision=r.savedRevision}previewOpen=false;previewFull=false;previewPatches.clear();previewError=null;needFull=false;sentValues.clear();
 await refreshConfig();
 }finally{busy=false;showDirty()}
}
function markDirty(){editRevision++;dirty=true;showDirty()}
function get(path){return path.split('.').reduce((v,k)=>v?.[k],config)}
function set(path,value){const keys=path.split('.');const key=keys.pop();keys.reduce((v,k)=>v[k],config)[key]=value;markDirty();const output=document.querySelector('[data-value="'+path+'"]');if(output)output.textContent=value;schedulePreview(path,value)}
function field(path,label,kind='number',options=null,min='',max='',step='1'){let value=get(path), control;const attrs=`data-path="${path}"`;
 if(kind==='select')control=`<select ${attrs}>${options.map((t,i)=>`<option value="${i}" ${+value===i?'selected':''}>${esc(t)}</option>`).join('')}</select>`;
 else if(kind==='checkbox')control=`<input type="checkbox" ${attrs} ${value?'checked':''}>`;
 else if(kind==='color')control=`<input type="color" ${attrs} value="#${(+value).toString(16).padStart(6,'0')}">`;
 else control=`<input type="${kind}" ${attrs} value="${esc(value)}" min="${min}" max="${max}" step="${step}" ${kind==='password'?'autocomplete="new-password"':''}>`;
 return `<label class="field">${esc(label)}${kind==='range'?`<output data-value="${path}">${value}</output>`:''}${control}</label>`}
function panel(title,html){return `<section class="panel"><h2>${title}</h2>${html}</section>`}
function pinLabel(i){const p=state?.channels?.[i]?.pins;return p?`Контакты: +12 В — ${p[0]}, DATA — ${p[1]}, GND — ${p[2]}`:'Контакты: загрузка…'}
function migrateConfig(c){if(c.schema===3){const order=state?.channels?.map(x=>x.legacyIndex);if(!order||order.length!==8||new Set(order).size!==8||order.some(i=>!Number.isInteger(i)||i<0||i>7))throw Error('Обновите страницу перед импортом');const reorder=a=>order.map(i=>a[i]);c.strips=reorder(c.strips);for(const p of c.presets)if(p.used)p.strips=reorder(p.strips);c.schema=4}if(c.schema===4){c.global.autoRetry=true;for(const s of c.strips)s.speed=c.global.speed;for(const p of c.presets)if(p.used)for(const s of p.strips)s.speed=p.global.speed;c.schema=5}return c}
function form(html){return `<div class="formgrid">${html}</div>`}
function metrics(){return `<div class="grid metrics">${[['rpm','Обороты','об/мин'],['speed','Скорость','км/ч'],['temp','Температура ОЖ','°C'],['throttle','Дроссель','%']].map(([id,title,unit])=>`<div class="metric"><span>${title}</span><strong id="m-${id}">—</strong><small>${unit}</small></div>`).join('')}</div>`}
function overview(){return metrics()+`<div class="sectionhead"><h2>Восемь каналов</h2><span class="badge">Нажмите на канал для настройки</span></div><div class="grid">${config.strips.map((s,i)=>`<button class="channel" data-strip="${i}" id="ch-${i}"><div class="number">КАНАЛ ${String(i+1).padStart(2,'0')} · ${s.count} LED</div><div class="hint" id="pins-${i}">${pinLabel(i)}</div><div class="current"><span id="amp-${i}">0.00</span> <small>А</small></div><div class="state" id="chstate-${i}">Выключен</div><div class="bar"><i id="bar-${i}"></i></div></button>`).join('')}</div><p class="hint">У каждого выхода свой лимит тока и защёлка защиты. Master управляет всеми разрешёнными каналами.</p>`+panel('Общие настройки',globalFields())+panel('Пресеты',`<div class="row">${config.presets.map((p,i)=>`<div><span class="badge">${i+1}. ${esc(p.used?p.name:'Пусто')}</span><div class="row" style="margin-top:8px"><button data-preset="save:${i}">Записать</button><button data-preset="load:${i}" ${p.used?'':'disabled'}>Загрузить</button></div></div>`).join('')}</div>`)}
function globalFields(){return form(field('global.brightness','Общая яркость, %','number',null,0,100)+field('global.minRpm','Начало шкалы, об/мин','number',null,0,12000,100)+field('global.maxRpm','Конец шкалы, об/мин','number',null,1,16000,100)+field('global.shiftRpm','Shift-light, об/мин (0 = конец шкалы)','number',null,0,16000,100)+field('global.shiftColor','Цвет shift-light','color')+field('global.engineOff','Когда нет оборотов / данных','select',['Продолжать','Приглушить','Погасить'])+field('global.dim','Приглушение, %','number',null,0,100)+field('global.cutPowerEngineOff','Отключать питание при погашении','checkbox')+field('global.powerLimitMa','Измеряемый лимит всех лент, мА (0 = выкл.)','number',null,0,40000,500)+field('global.maxSpeed','Полная шкала скорости, км/ч','number',null,1,400)+field('global.maxG','Полная шкала ускорения, g','number',null,.1,10,.1)+field('global.maxYaw','Полная шкала вращения, °/с','number',null,1,2000))}
function channels(){const p='strips.'+strip+'.';return `<div class="stripnav">${config.strips.map((_,i)=>`<button data-strip="${i}" class="${i===strip?'active':''}">${i+1}</button>`).join('')}</div>`+panel('Канал '+(strip+1),`<p class="hint" id="channelPins">${pinLabel(strip)}</p><div class="colorpreview" style="background:repeating-linear-gradient(90deg,#${config.strips[strip].color.toString(16).padStart(6,'0')} 0 12px,#202020 12px 16px)"></div>`+form(field(p+'enabled','Канал разрешён','checkbox')+field(p+'reverse','Обратное направление','checkbox')+field(p+'count','Количество светодиодов','number',null,8,1000)+field(p+'mode','Режим','select',['Анимация','Шкала','Шкала + анимация'])+field(p+'animation','Анимация','select',animations)+field(p+'source','Источник шкалы','select',sources)+field(p+'color','Основной цвет','color')+field(p+'brightness','Яркость канала, %','range',null,0,100)+field(p+'speed','Скорость анимации, %','range',null,0,100)+field(p+'order','Порядок цветов','select',['RGB','GRB','BGR','RBG','GBR','BRG'])+field(p+'middle','Шкала от середины','checkbox')+field(p+'center','Центральный LED (с нуля)','number',null,0,config.strips[strip].count-1)+field(p+'maxAmps','Лимит тока, А','number',null,.5,5,.1)+field(p+'currentCal','Коэффициент калибровки тока','number',null,.3,3,.01))+`<p class="hint">Ток и защита: <b id="channelLive">—</b>. Калибровка = ток по прибору / показанный ток.</p><div class="row"><button id="copyChannels">Копировать на все каналы</button><button id="resetChannel">Сбросить защиту канала</button></div>`)}
function inputs(){return config.inputs.map((_,i)=>{const p='inputs.'+i+'.';return panel('Вход '+(i+1),`<p class="hint" id="inputLive-${i}">—</p>`+form(field(p+'mode','Тип входа','select',['Аналоговый, без подтяжки','Активен от +12 В, pull-down','Активен от массы, pull-up'])+field(p+'low','Начало аналоговой шкалы, В','number',null,0,16,.1)+field(p+'high','Конец аналоговой шкалы, В','number',null,0,16,.1)+field(p+'thresholdMv','Порог цифрового входа на АЦП, мВ','number',null,0,3100,1))+`<p class="hint">Для замыкания на массу начальный порог — 1565 мВ; для +12 В — 600 мВ. Уточняйте порог по живым показаниям конкретной платы. Вход можно выбрать источником шкалы на странице канала.</p>`) }).join('')}
function can(){return panel('Источник данных',form(field('can.mode','Протокол','select',['OBD2 CAN — активный опрос','BMW MS43 CAN — пассивный','CAN monitor — пассивный','BMW MS43 K-line DS2'])+field('can.bitrate','Скорость CAN','select',['Автопоиск (пассивные режимы)','500 кбит/с','250 кбит/с','125 кбит/с','100 кбит/с','1 Мбит/с']))+`<p class="hint" id="canLive">—</p>`)+metrics()+panel('Монитор CAN',`<button id="readCan">Прочитать кадры</button><pre id="canFrames">Включите пассивный монитор CAN для просмотра кадров.</pre>`)}
function imu(){return panel('Датчик движения',`<div class="grid metrics">${['ax','ay','az','gx','gy','gz','temp','yaw'].map(n=>`<div class="metric"><span>${n.toUpperCase()} ${n[0]==='a'?'g':n==='temp'?'°C':'°/с'}</span><strong id="imu-${n}" style="font-size:23px">—</strong></div>`).join('')}</div>`+form(field('global.lateralAxis','Ось поперечного ускорения','select',['+X','−X','+Y','−Y','+Z','−Z'])+field('global.yawAxis','Ось вращения','select',['+X','−X','+Y','−Y','+Z','−Z']))+`<p class="hint">Перед калибровкой поставьте машину ровно и заглушите двигатель.</p><button id="calibrate">Калибровать ноль</button>`)}
function wifi(){return panel('Подключение',`<p class="hint" id="netLive">—</p>`+form(field('network.ssid','Имя домашней сети (пусто = точка доступа)','text')+field('network.password','Новый пароль сети','password')+field('network.keepPassword','Сохранить прежний пароль','checkbox'))+`<p class="hint">Сохраните настройки и нажмите «Переподключить». При запуске контроллер ищет сохранённую сеть один раз. Для найденной сети возможны до трёх попыток подключения при запуске, пока к точке никто не подключился. В машине работает точка ZVER-L8 без фонового поиска сетей. Кнопка запускает новую попытку; телефон может кратко потерять связь при смене канала. Адрес точки: 192.168.4.1.</p><button id="reconnect">Переподключить</button>`)}
function system(){return panel('Питание и запуск',form(field('global.autoStart','Включать Master при загрузке','checkbox')+field('global.allowWithoutIgn','Ленты работают без IGN','checkbox')+field('global.autoRetry','Повторы при перегрузке: 1 / 5 / 30 с','checkbox')+field('global.sensor5v','Питание датчиков 5 В','checkbox'))+`<p class="hint">Для лент нужны 9–16,5 В и включённый Master. Снимите галочку «Ленты работают без IGN», чтобы питание лент зависело от зажигания. Снятие IGN не выключает работающий контроллер и датчики.</p><div class="row"><button id="resetAll">Сбросить все защиты</button><button id="reboot">Перезагрузить</button></div>`)+panel('Конфигурация',`<div class="row"><button id="export">Скачать резервную копию</button><label class="field">Восстановить JSON<input id="import" type="file" accept=".json,application/json"></label></div><p class="hint">Копия содержит настройки, пресеты и пароль Wi-Fi. При применении Master сохраняет своё состояние. После загрузки файла проверьте настройки и нажмите «Сохранить».</p>`)+panel('Прошивка',`<p class="hint" id="buildLive">—</p><div class="row"><input id="firmware" type="file" accept=".bin" style="max-width:340px"><button id="ota">Обновить прошивку</button></div><p class="hint">Выберите firmware.bin для L8 v3. Во время обновления выходы выключены. Новая версия подтверждается после самопроверки; при неудаче загрузчик возвращает предыдущую.</p><p id="otaState" class="hint"></p>`)+panel('Журнал',`<button id="readLog">Обновить журнал</button><pre id="log">Журнал загрузки и работы контроллера.</pre>`)}
function render(){if(!config)return;$('title').textContent=pages[page];$('nav').innerHTML=pages.map((p,i)=>`<button data-page="${i}" class="${page===i?'active':''}">${p}</button>`).join('');$('view').innerHTML=[overview,channels,inputs,can,imu,wifi,system][page]();updateLive()}
function put(id,value){if($(id))$(id).textContent=value}
const FAULT_TEXT={overcurrent:'Перегрузка — защёлка','switch fault':'Защита силового ключа','invalid sample':'Ошибка измерения'};
const REASON_TEXT={master:'Master выключен',novbat:'Нет 12 В',ign:'Ожидание IGN',inhibit:'Выходы заблокированы',disabled:'Канал запрещён',engine:'Двигатель заглушен',io:'Состояние неизвестно'};
function retryText(c){return c.retryInMs>0?`Повтор ${c.retries+1}/3 через ${Math.ceil(c.retryInMs/1000)} с`:'Повтор ожидает разрешения питания'}
function onText(c){const cap=(c.brightnessScale??1)*(state.totalBrightnessScale??1);return cap<.99?`Ограничение тока · ${Math.round(cap*100)}% яркости`:'Включён'}
function channelState(c){
 // The power task picks the reason; the UI only translates it and adds detail.
 if(typeof c.reason==='string'){
  if(c.reason==='on')return onText(c);
  if(c.reason==='retry')return retryText(c);
  if(c.reason==='fault')return FAULT_TEXT[c.fault]||c.fault||'Защита канала';
  const why=REASON_TEXT[c.reason];
  if(!why)return `Неизвестное состояние (${c.reason})`;
  return c.retryPending?why+' · повтор после восстановления':why;
 }
 // Legacy status without reason (firmware before P1-A).
 if(state.ioFault)return 'Состояние неизвестно';
 if(c.retryPending)return retryText(c);
 if(c.fault)return FAULT_TEXT[c.fault]||c.fault;
 return c.on?onText(c):'Выключен';
}
function updateLive(){if(!state)return;put('vbat',num(state.vbat)+' В');put('ign',state.ign?'вкл.':'выкл.');put('total',num(state.totalAmps)+' А');put('powerStatus',state.powerStatus);put('version',state.firmware);put('ip',state.ip);put('master','Master · '+(state.master?'вкл.':'выкл.'));$('master').className=state.master?'primary':'';
 for(const n of ['rpm','speed','temp','throttle'])put('m-'+n,state.dataFresh?state[n]:'—');
 state.channels.forEach((c,i)=>{put('pins-'+i,pinLabel(i));put('amp-'+i,num(c.amps));put('chstate-'+i,channelState(c));const el=$('ch-'+i);if(el)el.className='channel'+(c.on?' on':'')+(c.fault?' fault':'');if($('bar-'+i))$('bar-'+i).style.width=Math.min(100,c.amps/config.strips[i].maxAmps*100)+'%'});
 const c=state.channels[strip];put('channelPins',pinLabel(strip));put('channelLive',num(c.amps)+' А · '+channelState(c));
 state.inputs.forEach((x,i)=>put('inputLive-'+i,`АЦП ${num(x.mv,0)} мВ · уровень ${num(x.value*100,0)}%`));
 for(const n of ['ax','ay','az','gx','gy','gz','temp','yaw'])put('imu-'+n,state.imu.ok?num(state.imu[n],n==='temp'?1:2):'—');
 put('canLive',state.canStatus+' · '+state.canBitrate);put('netLive',state.network);put('buildLive',`Версия ${state.firmware} · flash ${state.flash/1048576} МБ · PSRAM ${state.psram/1048576} МБ · свободно ${Math.round(state.heap/1024)} КиБ`)}
async function refreshConfig(){config=await api('config');serverRevision=state?.configRevision??serverRevision;dirty=false;render();showDirty()}
async function act(action,extra={}){await post('action',{action,...extra});state=await api('status');updateLive()}
$('save').onclick=async()=>{
 if(busy)return;
 const invalid=$('view').querySelector('input:invalid');if(invalid){invalid.reportValidity();return}
 // Save covers the edits made before this click. Edits made while it runs stay
 // pending/dirty and are previewed afterwards; they are never reported as written.
 const revision=editRevision,clickConfig=clone(config),clickFull=previewFull||needFull,clickPatches=new Map(previewPatches);
 busy=true;$('save').disabled=true;$('save').textContent='Сохранение…';clearTimeout(previewTimer);previewGate=false;previewFull=false;previewPatches.clear();needFull=false;
 try{
 await settlePreview();
 let full=clickFull;
 if(previewError){await reconcile();full=true}
 const jobs=full?[['apply',{config:clickConfig}]]:[...clickPatches].map(([strip,patch])=>['preview',{strip,patch}]);
 if(jobs.length)await sendJobs(jobs);
 if(!previewOpen){if(editRevision===revision)dirty=false;toast('Изменений для записи нет');return}
 const result=await post('save',{client:editorId,revision:serverRevision});serverRevision=result.revision;previewOpen=false;sentValues.clear();
 const confirmed=result.savedRevision!=null&&result.savedRevision===result.revision;
 if(state){state.configRevision=result.revision;state.savedRevision=result.savedRevision??null;state.previewActive=false;updateLive()}
 if(editRevision===revision&&!pendingPreview()){dirty=false;config.network.password='';config.network.keepPassword=true;
 const password=document.querySelector('[data-path="network.password"]');if(password)password.value='';
 const keep=document.querySelector('[data-path="network.keepPassword"]');if(keep)keep.checked=true}
 toast(confirmed?'Настройки записаны':'Запись не подтверждена контроллером',!confirmed);
 }catch(e){
  // Nothing edited is dropped: the next attempt re-applies the whole local config.
  needFull=true;if(e.status!==400&&e.status!==507)previewError=e;toast(e.message,true);
 }finally{busy=false;$('save').textContent='Сохранить';showDirty();pumpPreview()}
};
$('master').onclick=async()=>{try{await act('master',{on:!state?.master})}catch(e){toast(e.message,true)}};
document.addEventListener('input',e=>{const el=e.target,path=el.dataset.path;if(path&&(el.type==='color'||el.type==='range'))set(path,el.type==='color'?parseInt(el.value.slice(1),16):Number(el.value))});
document.addEventListener('change',e=>{const path=e.target.dataset.path;if(!path)return;const el=e.target;let value=el.type==='checkbox'?el.checked:el.type==='color'?parseInt(el.value.slice(1),16):el.type==='number'||el.type==='range'||el.tagName==='SELECT'?Number(el.value):el.value;set(path,value);if(/^inputs\.\d\.mode$/.test(path)&&value>0){const key=path.replace('.mode','.thresholdMv');set(key,value===2?1565:600);const el=document.querySelector('[data-path="'+key+'"]');if(el)el.value=get(key)}if(path==='network.password'){set('network.keepPassword',false);const keep=document.querySelector('[data-path="network.keepPassword"]');if(keep)keep.checked=false}});
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;try{
 if(b.dataset.page!==undefined){page=+b.dataset.page;render();return}if(b.dataset.strip!==undefined){strip=+b.dataset.strip;page=1;render();return}
 if(b.dataset.preset){if(dirty)throw Error('Сначала сохраните настройки');const [op,i]=b.dataset.preset.split(':');await act('preset_'+op,{slot:+i});await refreshConfig();toast('Пресет '+(op==='save'?'сохранён':'загружен'));return}
 if(b.id==='copyChannels'){const source=config.strips[strip];config.strips=config.strips.map((s,i)=>i===strip?s:{...source,count:s.count,maxAmps:s.maxAmps,currentCal:s.currentCal,center:Math.min(source.center,s.count-1)});markDirty();schedulePreview('all',null);toast('Предпросмотр всех каналов')}
 if(b.id==='discardPreview'){await discardPreview();return}if(b.id==='resetChannel')await act('reset',{channel:strip});if(b.id==='resetAll')await act('reset',{channel:-1});
 if(b.id==='calibrate'){await act('calibrate');await refreshConfig();toast('Ноль IMU сохранён')}
 if(b.id==='reconnect'){if(dirty)throw Error('Сначала сохраните настройки');await act('reconnect');toast('Переподключение Wi-Fi')}
 if(b.id==='reboot'){await act('reboot');toast('Перезагрузка…')}
 if(b.id==='readCan')put('canFrames',await api('can'));if(b.id==='readLog')put('log',await api('log'));
 if(b.id==='export'){const backup=await api('config?backup=1');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(backup,null,2)],{type:'application/json'}));a.download='zver-l8-config.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
 if(b.id==='ota'){const file=$('firmware').files[0];if(!file)throw Error('Выберите firmware.bin');if(!file.name.endsWith('.bin'))throw Error('Нужен файл .bin');const formData=new FormData();formData.append('firmware',file);b.disabled=true;put('otaState','Загрузка прошивки…');try{await api('ota',{method:'POST',body:formData});put('otaState','Записано. Перезагрузка и самопроверка…');setTimeout(()=>location.reload(),9000)}finally{b.disabled=false}}
 }catch(error){toast(error.message,true)}});
document.addEventListener('change',async e=>{if(e.target.id!=='import')return;try{const file=e.target.files[0];if(!file)return;if(file.size>24000)throw Error('Файл слишком большой');const c=JSON.parse(await file.text());if(![3,4,5].includes(c.schema)||c.strips?.length!==8||c.inputs?.length!==3||!c.global||!c.network||!c.can||c.presets?.length!==3)throw Error('Нужна конфигурация L8 v3');config=migrateConfig(c);markDirty();schedulePreview('all',null);render();toast('Конфигурация загружена в редактор; проверьте и сохраните')}catch(error){toast(error.message,true)}});
let statusEvents=null, lastPush=0;
function closeStatus(){if(statusEvents)statusEvents.close();statusEvents=null}
function openStatus(){
 if(document.hidden||typeof EventSource==='undefined')return;
 closeStatus();statusEvents=new EventSource('/api/events?token='+encodeURIComponent(token));lastPush=Date.now();
 statusEvents.addEventListener('status',event=>{try{state=JSON.parse(event.data);lastPush=Date.now();$('dot').classList.add('online');put('connection','На связи');noteBoot(state);updateLive();showDirty()}catch{closeStatus()}});
 statusEvents.onerror=()=>{closeStatus();$('dot').classList.remove('online');put('connection','Восстанавливаем связь…')};
}
async function poll(){try{
 if(!busy&&!document.hidden&&(!statusEvents||Date.now()-lastPush>5000)){
  closeStatus();token=(await api('session')).token;state=await api('status');noteBoot(state);$('dot').classList.add('online');put('connection','На связи');updateLive();showDirty();openStatus();
 }
 }catch(e){$('dot').classList.remove('online');put('connection','Нет связи — повторяем…')}finally{setTimeout(poll,5000)}}
document.addEventListener('visibilitychange',()=>{if(document.hidden)closeStatus();else{openStatus();resumeVisible()}});
async function connect(){try{
 token=(await api('session')).token;state=await api('status');noteBoot(state);await refreshConfig();$('master').disabled=false;
 $('dot').classList.add('online');put('connection','На связи');openStatus();setTimeout(poll,5000);keepPreview();
 }catch(e){$('dot').classList.remove('online');put('connection','Повторное подключение…');
 $('view').innerHTML=panel('Подключаемся к ZVER L8',`<p class="hint">${esc(e.message)}. Повторяем подключение автоматически…</p>`);
 setTimeout(connect,2000)}
}
connect();
</script></body></html>
